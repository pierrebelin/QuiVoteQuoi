name: Sources de programmes

# File de revue humaine des sources de programme (README.md §8.2) : une issue
# par source modifiée, avec les fragments ajoutés et retirés ; un nouveau
# changement d'une source déjà en revue s'y ajoute en commentaire. La
# vérification quotidienne (timer systemd) ne publie jamais rien.
on:
  schedule:
    # Après la vérification quotidienne (06:10 + délai aléatoire de 10 min).
    - cron: '30 7 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read
  actions: read

jobs:
  notify:
    name: Signaler les sources modifiées
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lire les sources modifiées depuis le dernier passage réussi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          # Un passage en échec quelques jours ne perd rien ; un changement
          # déjà signalé est reconnu à son marqueur et n'est pas répété.
          last_success="$(gh run list --repo "$GH_REPO" --workflow program-sources.yml \
            --status success --limit 1 --json createdAt --jq '.[0].createdAt // empty')"
          if [[ -n "$last_success" ]]; then
            days=$(( ( $(date -u +%s) - $(date -u -d "$last_success" +%s) ) / 86400 + 1 ))
          else
            days=14
          fi
          (( days > 90 )) && days=90
          echo "Fenêtre : ${days} jour(s)"
          curl -fsS --max-time 30 \
            "$PUBLIC_BASE_URL/api/candidats-2027/sources-modifiees?jours=${days}" \
            -o response.json
          jq -e '.changed_sources | type == "array"' response.json >/dev/null

      - name: Ouvrir ou compléter une issue par source modifiée
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/program-source-issues.sh response.json
